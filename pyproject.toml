[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falcons"
version = "1.0.0"
description = "FALCON-S: fixed-wing flight-control simulation framework and controller benchmark near the ground"
requires-python = "==3.10.*"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pandas==2.2.3",
  "matplotlib==3.10.3",
  "pillow==11.2.1",
  "torch==2.7.0",
  "warp-lang==1.8.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
falcons = "falcons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
falcons = ["aircraft/data/*/*.json", "aircraft/data/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full reproduction, minutes to hours", "cuda: needs an NVIDIA GPU"]
filterwarnings = ["ignore::pyparsing.warnings.PyparsingDeprecationWarning"]
